<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 말해보카 Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-graduation-cap text-2xl"></i>
            <h1 class="text-lg font-bold tracking-tight">AI 말해보카 Coach</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button id="level-badge" onclick="changeLevel()" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-full text-xs font-bold transition shadow-inner">Lv.1 왕초보</button>
            <button onclick="startLevelTest()" class="bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">실력 진단</button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white shadow-sm flex justify-around border-b border-slate-200 sticky top-14 z-40">
        <button onclick="switchTab('quiz')" id="tab-quiz" class="flex-1 py-3.5 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm transition"><i class="fa-solid fa-puzzle-piece mr-1"></i> 실전 퀴즈</button>
        <button onclick="switchTab('voca')" id="tab-voca" class="flex-1 py-3.5 text-center font-medium text-slate-500 hover:text-indigo-600 text-sm transition"><i class="fa-solid fa-book-open mr-1"></i> 오늘의 단어</button>
        <button onclick="switchTab('review')" id="tab-review" class="flex-1 py-3.5 text-center font-medium text-slate-500 hover:text-indigo-600 text-sm transition"><i class="fa-solid fa-rotate-left mr-1"></i> 스마트 복습 <span id="review-count" class="bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full ml-1 hidden">0</span></button>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 pb-24">
        <!-- TAB 1: QUIZ -->
        <section id="section-quiz" class="space-y-4">
            <div class="flex justify-between items-center bg-white p-3.5 rounded-xl shadow-sm border border-slate-100">
                <span id="quiz-category" class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md font-bold">기초 필수 패턴</span>
                <span id="quiz-progress" class="text-xs text-slate-500 font-bold">문제 1 / 5</span>
            </div>

            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 space-y-5">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">빈칸 채우기 & 스피킹</span>
                    <button onclick="speakCurrentSentence()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center shadow-sm active:scale-95">
                        <i class="fa-solid fa-volume-high mr-1.5 text-sm"></i> 원어민 발음 듣기
                    </button>
                </div>
                
                <div class="py-2 space-y-2">
                    <p id="quiz-kor" class="text-xl font-extrabold text-slate-800 leading-snug"></p>
                    <p id="quiz-eng-hint" class="text-base text-indigo-600 font-mono font-semibold bg-slate-50 p-3 rounded-lg border border-slate-200"></p>
                </div>

                <div class="space-y-2.5">
                    <div class="flex space-x-2">
                        <input type="text" id="user-answer" placeholder="빈칸의 영단어를 입력하거나 말하세요" onkeypress="if(event.key==='Enter') checkAnswer()" class="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="startVoiceRecognition()" id="mic-btn" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-4 py-3 rounded-xl transition active:scale-95" title="내 목소리로 말하기">
                            <i class="fa-solid fa-microphone text-lg"></i>
                        </button>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="checkAnswer()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-sm active:scale-98">정답 확인</button>
                        <button onclick="showHint()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-4 py-3.5 rounded-xl font-bold text-xs transition">힌트 보기</button>
                    </div>
                </div>

                <div id="result-box" class="hidden p-4 rounded-xl text-sm font-medium leading-relaxed"></div>
            </div>

            <div class="flex space-x-2">
                <button onclick="prevQuiz()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-5 py-3.5 rounded-xl font-bold text-sm shadow-sm transition"><i class="fa-solid fa-arrow-left"></i></button>
                <button onclick="nextQuiz()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white py-3.5 rounded-xl font-bold text-sm shadow-sm transition">다음 문제 <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
        </section>

        <!-- TAB 2: VOCA -->
        <section id="section-voca" class="hidden space-y-4">
            <div class="bg-emerald-600 text-white p-4 rounded-2xl shadow-md flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-base">오늘의 필수 회화 단어장</h3>
                    <p class="text-xs text-emerald-100 mt-0.5">발음을 듣고 예문과 함께 뉘앙스를 익혀보세요.</p>
                </div>
                <button onclick="startVocaQuiz()" class="bg-white text-emerald-700 font-bold px-3.5 py-2 rounded-xl text-xs shadow-sm hover:bg-emerald-50 transition">단어 테스트</button>
            </div>
            <div id="voca-list-container" class="space-y-3"></div>
        </section>

        <!-- TAB 3: REVIEW -->
        <section id="section-review" class="hidden space-y-4">
            <div class="bg-indigo-900 text-white p-5 rounded-2xl shadow-md space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-base"><i class="fa-solid fa-brain mr-2 text-amber-400"></i> 에빙하우스 스마트 복습</h3>
                    <span class="text-xs bg-indigo-800 text-indigo-200 px-2.5 py-1 rounded-full">자동 우선순위 정렬</span>
                </div>
                <p class="text-xs text-indigo-200 leading-relaxed">틀린 횟수와 최근 오답 시간을 분석해 가장 시급한 단어부터 복습합니다. 복습 퀴즈에서 3회 연속 맞히면 오답노트에서 졸업합니다!</p>
                <div class="pt-1 flex space-x-2">
                    <button onclick="startReviewQuiz()" class="flex-1 bg-amber-400 hover:bg-amber-500 text-indigo-950 font-extrabold py-3 rounded-xl text-xs transition shadow-sm">추천 순서대로 복습 시작</button>
                    <button onclick="clearReviewList()" class="bg-indigo-800 hover:bg-indigo-700 text-indigo-200 px-4 py-3 rounded-xl text-xs font-bold transition">비우기</button>
                </div>
            </div>
            <div id="review-list-container" class="space-y-3"></div>
        </section>
    </main>

    <script>
        const levelNames = ["왕초보", "초급1", "초급2", "중급1", "중급2", "중상급", "고급1", "고급2", "원어민급", "마스터"];
        let currentLevel = 1;
        let quizIdx = 0;
        let reviewList = JSON.parse(localStorage.getItem('myVocaReview') || '[]');
        let isReviewMode = false;

        const allQuizzes = {
            1: [
                { kor: "시간 좀 있으세요?", eng: "have", full: "Do you have some time?", hint: "Do you h___ some time?", cat: "Lv.1 일상 기초", nuance: "'가지고 있다'의 가장 기본 동사 have를 씁니다." },
                { kor: "오늘 날씨가 참 좋네요.", eng: "nice", full: "The weather is really nice today.", hint: "The weather is really n___ today.", cat: "Lv.1 스몰토크", nuance: "기분 좋게 맑은 날씨는 good보다 nice를 자주 씁니다." },
                { kor: "집에 일찍 가고 싶어요.", eng: "want", full: "I want to go home early.", hint: "I w___ to go home early.", cat: "Lv.1 의사표현", nuance: "~하고 싶다는 표현은 want to 동사원형을 씁니다." },
                { kor: "오늘 아침 몇 시에 일어났어요?", eng: "wake", full: "What time did you wake up this morning?", hint: "What time did you w___ up this morning?", cat: "Lv.1 일상 루틴", nuance: "잠에서 깨어나는 것은 wake up을 씁니다." },
                { kor: "여권 좀 보여주시겠어요?", eng: "show", full: "Could you show me your passport?", hint: "Could you s___ me your passport?", cat: "Lv.1 여행 기초", nuance: "보여달라고 정중히 요청할 때 show me를 씁니다." }
            ],
            2: [
                { kor: "제가 나중에 다시 전화할게요.", eng: "call", full: "I will call you back later.", hint: "I will c___ you back later.", cat: "Lv.2 전화 영어", nuance: "전화를 다시 걸 때는 call back이라고 표현합니다." },
                { kor: "이거 한 번 입어봐도 될까요?", eng: "try", full: "Can I try this on?", hint: "Can I t__ this on?", cat: "Lv.2 쇼핑 회화", nuance: "옷이나 신발을 시착해 볼 때는 try on을 씁니다." },
                { kor: "메뉴판 좀 주시겠어요?", eng: "get", full: "Can I get a menu, please?", hint: "Can I g__ a menu, please?", cat: "Lv.2 식당 주문", nuance: "식당에서 무언가를 요청할 때 Can I get~이 가장 자연스럽습니다." }
            ],
            3: [
                { kor: "그 일정은 다음 주로 미루자.", eng: "put", full: "Let's put off the meeting until next week.", hint: "Let's p__ off the meeting until next week.", cat: "Lv.3 핵심 구동사", nuance: "일정을 연기하다/미루다는 postpone 대신 구동사 put off를 많이 씁니다." },
                { kor: "혹시 모르니 우산 챙겨가.", eng: "case", full: "Take an umbrella just in case.", hint: "Take an umbrella just in c___.", cat: "Lv.3 원어민 패턴", nuance: "'혹시 모르니까'는 원어민들이 입에 달고 사는 just in case입니다." },
                { kor: "오늘 저녁은 내가 쏠게!", eng: "treat", full: "Dinner is on me tonight! It's my treat.", hint: "Dinner is on me tonight! It's my t____.", cat: "Lv.3 실전 관용구", nuance: "내가 대접한다는 표현으로 It's my treat 또는 It's on me를 씁니다." }
            ]
        };

        const dailyVoca = [
            { word: "figure out", kor: "이해하다, 알아내다, 해결하다", ex: "I'm trying to figure out how to use this app.", level: "필수 구동사" },
            { word: "up to you", kor: "네 결정에 달렸어 (네 마음대로 해)", ex: "It's completely up to you.", level: "일상 패턴" },
            { word: "make sense", kor: "말이 되다, 일리가 있다", ex: "Does that make sense to you?", level: "원어민 단골" },
            { word: "sleep on it", kor: "(바로 결정 않고) 하룻밤 자면서 진지하게 고민해보다", ex: "It's a big decision. Let me sleep on it.", level: "실전 관용구" },
            { word: "rain check", kor: "다음에 다시 잡는 약속 (미룬 약속)", ex: "Can I take a rain check on dinner tonight?", level: "미드 단골" }
        ];

        function getActiveQuizList() {
            if (isReviewMode && reviewList.length > 0) return reviewList;
            return allQuizzes[currentLevel] || allQuizzes[3];
        }

        // 모바일/PC 완벽 대응 하이브리드 원어민 TTS
        function speakText(text) {
            if (!text) return;
            try {
                const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
                const audio = new Audio(audioUrl);
                audio.play().catch(() => fallbackTTS(text));
            } catch (e) {
                fallbackTTS(text);
            }
        }

        function fallbackTTS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 0.92;
                window.speechSynthesis.speak(u);
            }
        }

        function speakCurrentSentence() {
            const list = getActiveQuizList();
            speakText(list[quizIdx].full);
        }

        function loadQuiz() {
            const list = getActiveQuizList();
            if (quizIdx >= list.length) quizIdx = 0;
            if (quizIdx < 0) quizIdx = list.length - 1;
            const q = list[quizIdx];

            document.getElementById('quiz-kor').innerText = q.kor;
            document.getElementById('quiz-eng-hint').innerText = q.hint;
            document.getElementById('quiz-category').innerText = isReviewMode ? `🔥 오답 복습 모드 (${q.wrongCount || 1}회 틀림)` : q.cat;
            document.getElementById('quiz-progress').innerText = `문제 ${quizIdx + 1} / ${list.length}`;
            document.getElementById('user-answer').value = '';
            document.getElementById('result-box').classList.add('hidden');
            updateReviewBadge();
        }

        function checkAnswer() {
            const list = getActiveQuizList();
            const q = list[quizIdx];
            const userAns = document.getElementById('user-answer').value.trim().toLowerCase();
            const correctAns = q.eng.toLowerCase();
            const box = document.getElementById('result-box');
            box.classList.remove('hidden');

            if (userAns && (userAns === correctAns || userAns === q.full.toLowerCase())) {
                box.className = "p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-900 border border-emerald-200 space-y-1";
                box.innerHTML = `<div class="font-bold text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i> 정답입니다! 완벽해요.</div>
                                 <div class="text-xs text-slate-700 font-mono">${q.full}</div>
                                 <div class="text-xs text-emerald-600 pt-1">💡 ${q.nuance || ''}</div>`;
                speakText(q.full);

                if (isReviewMode) {
                    q.streak = (q.streak || 0) + 1;
                    if (q.streak >= 3) {
                        reviewList = reviewList.filter(item => item.full !== q.full);
                        alert("🎉 3회 연속 정답! 이 문장을 완벽히 마스터하여 오답노트에서 졸업합니다.");
                        if (reviewList.length === 0) isReviewMode = false;
                    }
                    saveReview();
                }
            } else {
                box.className = "p-4 rounded-xl text-sm font-medium bg-rose-50 text-rose-900 border border-rose-200 space-y-1";
                box.innerHTML = `<div class="font-bold text-rose-700"><i class="fa-solid fa-circle-xmark mr-1"></i> 아쉽네요! 정답은 <span class="underline">${q.eng}</span> 입니다.</div>
                                 <div class="text-xs text-slate-700 font-mono">${q.full}</div>
                                 <div class="text-xs text-rose-600 pt-1">💡 ${q.nuance || '스마트 복습 노트에 자동 저장되었습니다.'}</div>`;
                speakText(q.full);
                addToReview(q);
            }
        }

        function addToReview(q) {
            const existing = reviewList.find(item => item.full === q.full);
            if (existing) {
                existing.wrongCount = (existing.wrongCount || 1) + 1;
                existing.streak = 0;
                existing.lastWrong = Date.now();
            } else {
                reviewList.push({ ...q, wrongCount: 1, streak: 0, lastWrong: Date.now() });
            }
            // 우선순위 정렬: 1순위 최근 틀림 & 다회 오답, 2순위 연속 성공 낮은 순
            reviewList.sort((a, b) => (b.wrongCount - a.wrongCount) || (a.streak - b.streak) || (b.lastWrong - a.lastWrong));
            saveReview();
        }

        function saveReview() {
            localStorage.setItem('myVocaReview', JSON.stringify(reviewList));
            updateReviewBadge();
        }

        function updateReviewBadge() {
            const badge = document.getElementById('review-count');
            if (reviewList.length > 0) {
                badge.innerText = reviewList.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function showHint() {
            const q = getActiveQuizList()[quizIdx];
            alert(`💡 힌트: 정답은 '${q.eng[0]}'(으)로 시작하는 ${q.eng.length}글자 단어입니다.\n해설: ${q.nuance || ''}`);
        }

        function nextQuiz() { quizIdx++; loadQuiz(); }
        function prevQuiz() { quizIdx--; loadQuiz(); }

        function changeLevel() {
            isReviewMode = false;
            currentLevel = currentLevel >= 3 ? 1 : currentLevel + 1;
            document.getElementById('level-badge').innerText = `Lv.${currentLevel} ${levelNames[currentLevel - 1]}`;
            quizIdx = 0;
            loadQuiz();
        }

        function startLevelTest() {
            const ans = prompt("실력 진단 미니 테스트!\n'그 회의를 다음 주로 미루자'에서 '미루다'에 해당하는 구동사는?\nLet's [   ] off the meeting.\n(모르면 취소를 누르세요)");
            if (ans && ans.trim().toLowerCase() === 'put') {
                currentLevel = 3;
                alert("정답입니다! 구동사 활용이 가능한 Lv.3 단계로 세팅합니다.");
            } else {
                currentLevel = 1;
                alert("기초부터 탄탄하게! Lv.1 왕초보 필수 패턴부터 시작합니다.");
            }
            document.getElementById('level-badge').innerText = `Lv.${currentLevel} ${levelNames[currentLevel - 1]}`;
            isReviewMode = false;
            quizIdx = 0;
            loadQuiz();
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("현재 브라우저에서는 음성 인식을 지원하지 않습니다. 크롬 또는 사파리를 이용해 주세요.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            const btn = document.getElementById('mic-btn');
            btn.classList.add('animate-pulse', 'bg-rose-500', 'text-white');
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.replace(/[.,!?]/g, '').trim();
                document.getElementById('user-answer').value = transcript;
                checkAnswer();
            };
            recognition.onend = function() {
                btn.classList.remove('animate-pulse', 'bg-rose-500', 'text-white');
            };
            recognition.start();
        }

        function renderVocaList() {
            const container = document.getElementById('voca-list-container');
            container.innerHTML = dailyVoca.map(v => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="font-extrabold text-base text-indigo-700">${v.word}</span>
                            <span class="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded ml-2 font-semibold">${v.level}</span>
                        </div>
                        <button onclick="speakText('${v.ex.replace(/'/g, "\\'")}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                            <i class="fa-solid fa-volume-high mr-1"></i> 발음
                        </button>
                    </div>
                    <p class="text-sm font-bold text-slate-700">${v.kor}</p>
                    <p class="text-xs text-slate-500 font-mono bg-slate-50 p-2 rounded">"${v.ex}"</p>
                </div>
            `).join('');
        }

        function startVocaQuiz() {
            isReviewMode = false;
            currentLevel = 3;
            switchTab('quiz');
            loadQuiz();
        }

        function renderReviewList() {
            const container = document.getElementById('review-list-container');
            if (reviewList.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-slate-100 text-sm">아직 틀린 문제가 없습니다.<br>실전 퀴즈에서 틀린 문제들이 이곳에 우선순위별로 자동 정리됩니다!</div>`;
                return;
            }
            container.innerHTML = reviewList.map((item, idx) => {
                const priorityLabel = item.wrongCount >= 2 ? "🚨 1순위 집중 취약" : (item.streak > 0 ? "👑 마스터 직전" : "🔥 긴급 복습");
                return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div class="space-y-1 pr-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-[11px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded">${priorityLabel}</span>
                            <span class="text-[11px] text-slate-400">오답 ${item.wrongCount}회 · 연속성공 ${item.streak || 0}/3</span>
                        </div>
                        <p class="text-sm font-bold text-slate-800">${item.kor}</p>
                        <p class="text-xs text-indigo-600 font-mono">${item.full}</p>
                    </div>
                    <button onclick="speakText('${item.full.replace(/'/g, "\\'")}')" class="bg-indigo-50 text-indigo-600 p-3 rounded-xl text-sm font-bold shrink-0">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>`;
            }).join('');
        }

        function startReviewQuiz() {
            if (reviewList.length === 0) {
                alert("복습할 오답이 없습니다! 먼저 실전 퀴즈를 풀어보세요.");
                return;
            }
            isReviewMode = true;
            quizIdx = 0;
            switchTab('quiz');
            loadQuiz();
        }

        function clearReviewList() {
            if (confirm("오답노트를 모두 초기화할까요?")) {
                reviewList = [];
                isReviewMode = false;
                saveReview();
                renderReviewList();
            }
        }

        function switchTab(tab) {
            ['quiz', 'voca', 'review'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "flex-1 py-3.5 text-center font-medium text-slate-500 hover:text-indigo-600 text-sm transition";
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "flex-1 py-3.5 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm transition";
            if (tab === 'voca') renderVocaList();
            if (tab === 'review') renderReviewList();
        }

        window.onload = () => {
            loadQuiz();
            renderVocaList();
        };
    </script>
</body>
</html>
